apply plugin: 'com.android.application'

/** Read REACT_APP_API_BASE_URL for native services (GalleryMonitorService). */
def resolveReactAppApiBaseUrl() {
    if (project.hasProperty('REACT_APP_API_BASE_URL')) {
        return project.property('REACT_APP_API_BASE_URL').toString().trim()
    }
    def fromEnv = System.getenv('REACT_APP_API_BASE_URL')
    if (fromEnv) {
        return fromEnv.trim()
    }
    def envFiles = [file('../../.env.production'), file('../../.env')]
    for (def envFile : envFiles) {
        if (!envFile.exists()) continue
        def found = null
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith('#') || !trimmed.contains('=')) return
            def idx = trimmed.indexOf('=')
            def key = trimmed.substring(0, idx).trim()
            if (key != 'REACT_APP_API_BASE_URL') return
            def val = trimmed.substring(idx + 1).trim()
            if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.substring(1, val.length() - 1)
            }
            found = val
        }
        if (found) return found
    }
    return 'https://wellness-valley.vercel.app'
}

android {
    namespace "com.wellnessvalley.app"
    compileSdk rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.wellnessvalley.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 59
        versionName "3.4.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // Inject Gemini API key from environment variable or gradle.properties
        def geminiKey = project.hasProperty('GEMINI_API_KEY') ? GEMINI_API_KEY : System.getenv('GEMINI_API_KEY') ?: ""
        buildConfigField "String", "GEMINI_API_KEY", "\"${geminiKey}\""

        // Same REACT_APP_API_BASE_URL as frontend (.env.production / npm run build)
        def apiBaseUrl = resolveReactAppApiBaseUrl()
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""

        def apiHost = 'wellness-valley.vercel.app'
        try {
            apiHost = new URL(apiBaseUrl).host
        } catch (Exception ignored) {
            logger.warn("Could not parse host from REACT_APP_API_BASE_URL=${apiBaseUrl}")
        }
        manifestPlaceholders = [apiHost: apiHost]
        
        // ✅ ANDROID PERFORMANCE: Enable multidex for better performance
        multiDexEnabled true
        
        // NDK configuration for 16KB alignment
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'
        }
        
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        
        // ✅ ANDROID PERFORMANCE: Vector drawable support
        vectorDrawables.useSupportLibrary = true
    }
    
    signingConfigs {
    release {
        storeFile file('../wellness-valley-keystore.jks')
        storePassword 'MyWellnessValley@234#'
        keyAlias 'wellness-valley'
        keyPassword 'MyWellnessValley@234#'
    }
}
    
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'FULL'
            }
        }
    }
    
    compileOptions {
        // Set to Java 21 (Capacitor 8 / AGP 8.13 requirement)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    
    packagingOptions {
        // Helps with 16KB alignment
        jniLibs {
            useLegacyPackaging = false
        }
        
        // Ensure 16KB alignment for all native libraries
        doNotStrip "**/*.so"
        pickFirst "**/libc++_shared.so"
    }
    
    // Enable 16KB page size support
    buildFeatures {
        buildConfig = true
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.work:work-runtime:2.8.1"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    
    // Updated desugaring for Java 17
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // OkHttp for Gemini API client
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    // AndroidX Security Crypto for EncryptedSharedPreferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Google Play Location & Activity Recognition (anti-cheat step validation)
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Google Play In-App Updates
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.play:app-update-ktx:2.1.0'
    
    // Material Components (for Snackbar)
    implementation 'com.google.android.material:material:1.9.0'
}

apply from: 'capacitor.build.gradle'
apply from: "custom-capacitor.gradle"

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        "-Xlint:unchecked",
        "-Xlint:deprecation"
    ]
    options.encoding = 'UTF-8'
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}