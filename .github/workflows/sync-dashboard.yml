name: Sync Playwright Results to QA Dashboard

on:
  workflow_run:
    workflows:
      - "Playwright Authentication and Profile Tests"
    types:
      - completed

jobs:
  sync-dashboard:

    runs-on: ubuntu-latest

    steps:

      - name: Sync completed workflow to QA Dashboard
        env:
          DASHBOARD_IMPORT_URL: ${{ secrets.DASHBOARD_IMPORT_URL }}

        run: |

          echo "=========================================="
          echo "Syncing completed Playwright workflow"
          echo "=========================================="

          echo "Run ID: ${{ github.event.workflow_run.id }}"
          echo "Status: ${{ github.event.workflow_run.status }}"
          echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Branch: ${{ github.event.workflow_run.head_branch }}"
          echo "Commit: ${{ github.event.workflow_run.head_sha }}"
          echo "Developer: ${{ github.event.workflow_run.actor.login }}"

          curl --fail-with-body \
            -X POST \
            "$DASHBOARD_IMPORT_URL" \
            -H "Content-Type: application/json" \
            -d '{
              "runId": "${{ github.event.workflow_run.id }}"
            }'

          echo ""
          echo "Dashboard sync completed."